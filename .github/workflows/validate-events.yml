name: Events regression

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: events-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install test dependencies and Chromium
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock.txt playwright==1.63.0
          .venv/bin/python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/radar-dom" --ignore-scripts jsdom@30.1.1
          echo "NODE_PATH=$RUNNER_TEMP/radar-dom/node_modules" >> "$GITHUB_ENV"
          browser=$(.venv/bin/python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )
          test -x "$browser"
          echo "RADAR_BROWSER=$browser" >> "$GITHUB_ENV"
          # Only this fresh checkout's historical test output is removed.
          rm -rf artifacts
          mkdir -p artifacts/ci
          git rev-parse HEAD > artifacts/ci/tested-commit.txt
      - name: Unit, API, syntax and DOM regressions
        shell: bash
        run: |
          .venv/bin/python -m pytest -q --junitxml=artifacts/ci/unit.xml | tee artifacts/ci/unit.log
          .venv/bin/python -m compileall -q radar tests
          for script in static/*.js; do node --check "$script"; done
          node --test tests/*_dom.cjs | tee artifacts/ci/dom.log
      - name: Desktop and mobile browser regressions
        shell: bash
        run: |
          result=0
          for suite in taxonomy_browser multiday_browser calendar_browser review_district_browser review_filter_context_browser review_personal_browser review_feedback_state_browser review_planning_browser review_decisions_browser review_session_boundary_browser review_recovery_browser feedback_browser review_browser coverage_browser readability_browser mobile_overlays_browser; do
            if [ -f "tests/$suite.py" ]; then
              .venv/bin/python "tests/$suite.py" 2>&1 | tee "artifacts/ci/$suite.log" || result=1
            fi
          done
          exit "$result"
      - name: Retain logs and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: events-regression-${{ github.event.pull_request.head.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

