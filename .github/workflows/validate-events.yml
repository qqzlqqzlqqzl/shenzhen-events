name: Events regression

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: events-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare isolated evidence before dependencies
        id: prepare_artifacts
        shell: bash
        run: |
          # Keep inherited output private on the runner; upload only this run.
          timeout 30s bash scripts/prepare_ci_artifacts.sh
          git rev-parse HEAD > artifacts/ci/tested-commit.txt
      - name: Select checks from the actual changed paths
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          timeout 20s python3 - <<'PY'
          import os, subprocess
          result = subprocess.run(['git', 'diff', '--name-only', os.environ['BASE_SHA'], 'HEAD'],
                                  capture_output=True, text=True, check=True, timeout=15)
          paths = result.stdout.splitlines()
          allowed_tests = {'tests/filter_state_dom.cjs', 'tests/redesign_browser.py', 'tests/storage_resilience_dom.cjs', 'tests/content_boundaries_dom.cjs', 'tests/calendar_facets_dom.cjs', 'tests/composition_races_dom.cjs'}
          allowed_workflow = '.github/workflows/validate-events.yml'
          ui_only = bool(paths) and all(p.startswith('static/') or p in allowed_tests or
                                        p == 'docs/design/events-reference.html' or p == allowed_workflow for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('ui_only=' + str(ui_only).lower() + chr(10))
          print('UI-only scoped checks' if ui_only else 'Full checks for backend/shared changes')
          print('Changed files:', len(paths))
          PY
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install test dependencies and Chromium
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock.txt playwright==1.63.0
          .venv/bin/python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/radar-dom" --ignore-scripts jsdom@30.1.1
          echo "NODE_PATH=$RUNNER_TEMP/radar-dom/node_modules" >> "$GITHUB_ENV"
          browser=$(.venv/bin/python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )
          test -x "$browser"
          echo "RADAR_BROWSER=$browser" >> "$GITHUB_ENV"
      - name: Enable test-only file retention
        shell: bash
        run: |
          retention_root=$(mktemp -d "$RUNNER_TEMP/events-test-retention.XXXXXXXX")
          mkdir -p "$retention_root/tmp"
          echo "RADAR_RETAIN_TEST_FILES=1" >> "$GITHUB_ENV"
          echo "RADAR_TEST_RETENTION_ROOT=$retention_root" >> "$GITHUB_ENV"
          echo "RADAR_TEST_WORKSPACE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "TMPDIR=$retention_root/tmp" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$retention_root/pycache" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/tests/ci_retention:$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Unit, API, syntax and DOM regressions
        if: steps.scope.outputs.ui_only != 'true'
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=10s 600s .venv/bin/python -m pytest -q --junitxml=artifacts/ci/unit.xml | tee artifacts/ci/unit.log
          timeout 60s .venv/bin/python -m compileall -q radar tests
          for script in static/*.js; do timeout 15s node --check "$script"; done
          timeout --signal=TERM --kill-after=10s 600s node --test tests/*_dom.cjs | tee artifacts/ci/dom.log
      - name: Desktop and mobile browser regressions
        if: steps.scope.outputs.ui_only != 'true'
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=10s 900s xvfb-run -a bash scripts/run_browser_matrix.sh
      - name: Scoped UI syntax and business state regressions
        if: steps.scope.outputs.ui_only == 'true'
        shell: bash
        run: |
          set -o pipefail
          for script in static/*.js; do timeout 15s node --check "$script"; done
          timeout --signal=TERM --kill-after=10s 240s node --test tests/composition_races_dom.cjs tests/filter_state_dom.cjs tests/calendar_facets_dom.cjs tests/content_boundaries_dom.cjs tests/session_boundary_dom.cjs tests/storage_resilience_dom.cjs | tee artifacts/ci/dom.log
      - name: Scoped desktop redesign acceptance
        if: steps.scope.outputs.ui_only == 'true'
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 180s xvfb-run -a .venv/bin/python tests/redesign_browser.py | tee artifacts/ci/redesign.log
      - name: Retain logs and screenshots
        if: always() && steps.prepare_artifacts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: events-regression-${{ github.event.pull_request.head.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

